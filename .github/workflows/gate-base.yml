name: gate-base

# Judges a pull request's workflow files with the base branch's copy of
# scripts/gate_integrity.py, so a pull request cannot weaken the gate that judges it.
# pull_request_target runs this file and every command from the base commit; the PR
# head is checked out as data only and nothing in it is executed.
on:
  pull_request_target:
    # edited covers a change of base branch, which leaves the head SHA as it was.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  checks: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A new in-progress gate-base run replaces any earlier verdict on this head SHA,
      # so a success judged against an earlier base does not stand while this run judges.
      # A run whose base is no longer the PR's current base (a retarget, a later push to
      # the base branch, or a re-run of an old event) posts nothing: only a run for the
      # current base may speak for the head.
      - name: Mark gate-base in progress on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          current() {
            live_ref=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref) || return 2
            # A branch name may hold URL syntax (#, ?, %), which must not cut the path short.
            path=${live_ref//%/%25}; path=${path//#/%23}; path=${path//\?/%3F}
            live_tip=$(gh api "repos/$REPO/git/ref/heads/$path" --jq .object.sha) || return 2
            [ "$live_ref" = "$BASE_REF" ] && [ "$live_tip" = "$BASE_SHA" ]
          }
          for attempt in 1 2 3; do
            if current; then state=0; else state=$?; fi
            if [ "$state" = 1 ]; then
              echo "::error::the PR's base is no longer $BASE_REF at $BASE_SHA; a run for the current base judges it"
              exit 1
            fi
            if [ "$state" = 0 ] && gh api --method POST "repos/$REPO/check-runs" \
              -f name=gate-base -f "head_sha=$HEAD_SHA" -f status=in_progress; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - name: Check out the PR head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
          # checkout refuses a fork head under pull_request_target by default. Nothing under
          # head/ is executed: the base gate only reads it, so fork PRs are judged like any other.
          allow-unsafe-pr-checkout: true
          sparse-checkout: |
            .github/workflows/
            scripts/gate_integrity.py
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Judge the head workflows with the base gate
        id: judge
        # Leaves the report step time to run within the job's timeout.
        timeout-minutes: 5
        # shell: bash adds pipefail, so the judge's exit, not tee's, sets the step outcome.
        shell: bash
        run: >-
          uv run --locked --project base python base/scripts/gate_integrity.py
          --base base/.github/workflows --head head/.github/workflows
          --base-script base/scripts/gate_integrity.py --head-script head/scripts/gate_integrity.py
          2>&1 | tee "$RUNNER_TEMP/gate.log"
      # A pull_request_target job's own check run attaches to the base commit, so the
      # required gate-base check is created on the PR head SHA through the Checks API.
      - name: Report gate-base on the PR head
        # Runs after a failed judge too; a cancelled run, whose judge did not finish, posts nothing.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.judge.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Checked again just before each post: the base may have moved while the judge ran.
          current() {
            live_ref=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref) || return 2
            # A branch name may hold URL syntax (#, ?, %), which must not cut the path short.
            path=${live_ref//%/%25}; path=${path//#/%23}; path=${path//\?/%3F}
            live_tip=$(gh api "repos/$REPO/git/ref/heads/$path" --jq .object.sha) || return 2
            [ "$live_ref" = "$BASE_REF" ] && [ "$live_tip" = "$BASE_SHA" ]
          }
          if [ "$OUTCOME" = success ]; then conclusion=success; else conclusion=failure; fi
          log="$RUNNER_TEMP/gate.log"
          summary="$RUNNER_TEMP/summary.md"
          [ -s "$log" ] || echo "gate-integrity did not run (outcome: $OUTCOME)" > "$log"
          # The Checks API caps the summary at 65535 characters. Backtick runs collapse to one
          # backtick, so head-controlled text in the log cannot close the code fence.
          { echo '```text'; head -c 60000 "$log" | sed 's/``*/`/g'; echo; echo '```'; } > "$summary"
          for attempt in 1 2 3; do
            if current; then state=0; else state=$?; fi
            if [ "$state" = 1 ]; then
              echo "::error::the PR's base is no longer $BASE_REF at $BASE_SHA, so this verdict is not posted"
              exit 1
            fi
            if [ "$state" = 0 ] && gh api --method POST "repos/$REPO/check-runs" \
              -f name=gate-base -f "head_sha=$HEAD_SHA" -f status=completed -f "conclusion=$conclusion" \
              -f "output[title]=gate-base: $conclusion" -F "output[summary]=@$summary"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::could not create the gate-base check run on $HEAD_SHA"
          exit 1
