# Example consumer profile. Copy to .agent-skills/profile.yaml in your project
# (or ~/.config/agent-skills/profile.yaml) and replace every value.
version: 1
project:
  name: Example App
  repos:
    - example-org/example-app
  test_command: make test
tracker:
  kind: linear
  team_key: EXA
  team_name: Example
  assignee: self
  assignee_email: bot@example.com
  agent_stamp: true
  states:
    triage: Triage
    backlog: Backlog
    ready: Ready To Work
    in_progress: In Progress
    blocked: Blocked
    in_review: In PR Review
    in_deployment_review: In Deployment Review
    done: Done
    canceled: Canceled
    duplicate: Duplicate
  labels:
    user_story: User Story
    spike: Spike
    bug: Bug
    investigation: Investigation
    feature: Feature
    improvement: Improvement
    rtb: RTB
  epic:
    name_prefix: "[EPIC]"
    icon: Cube
    label: Epic
    lead: "@me"
    size_labels:
      small: T-Shirt Size Small
      medium: T-Shirt Size Medium
      large: T-Shirt Size Large
      extra_large: T-Shirt Size Extra Large
  estimate_scale: fibonacci
  cycle_weeks: 2
  velocity_window_cycles: 3
  standup_aging_days: 3
git:
  host: github
  pr_assignee: example-user
  integration_branch: develop
  release_branch: main
  promotion: whole-branch
  merge_method: squash
  signed_commits: true
  ai_attribution: forbid
  branch_prefixes:
    feature: feat/
    fix: fix/
    docs: docs/
release:
  versioning: semver
  notes: github-release
review:
  reviewer:
    name: Codex
    runtime: codex
    model: gpt-5
  adjudicator:
    name: Claude adjudicator
    runtime: claude-code
    model: opus
  shadow_adjudicators:
    - name: Claude shadow adjudicator
      runtime: claude-code
      model: sonnet
  # Optional: non-blocking extra reviewers, one attempt each. Delete the list to skip them.
  optional_reviewers:
    - name: Optional reviewer
      runtime: opencode
      model: example/family-b
  merge_owner: human
  # The pre-PR adversarial gate (skills/adversarial-review-pipeline/SKILL.md).
  # hunter and arbiter are required: the gate is blocked while either is unset.
  pre_pr:
    # Optional: delete to skip the first-pass sweep and run the hunt only.
    sweeper:
      name: Sweeper
      runtime: opencode
      model: example/long-context
    hunter:
      name: Codex hunter
      runtime: codex
      model: gpt-5
    # The arbiter must be a different agent from the one implementing the story.
    arbiter:
      name: Claude arbiter
      runtime: claude-code
      model: sonnet
    # Escalation-only: used when the hybrid gate escalates to the Codex and Claude loop.
    simplicity_reviewer:
      name: Claude simplicity reviewer
      runtime: claude-code
      model: opus
    fixer:
      name: Claude fixer
      runtime: claude-code
      model: opus
environments:
  - name: dev
    branch: develop
    deploy: automatic on push to develop
    verify: GET https://dev.example.com/version returns the merged commit
    url: https://dev.example.com
    preauthorized: true
  - name: prod
    branch: main
    deploy: release workflow dispatch
    verify: GET https://example.com/version returns the release tag
    url: https://example.com
    production: true
qa:
  evidence_dir: docs/qa
decisions:
  dir: docs/decisions
refinement:
  facilitator:
    name: Scrum master
    runtime: opencode
    model: example/strong
  product_owner:
    name: Product owner
    runtime: opencode
    model: example/strong
  reviewers:
    - name: Engineer one
      runtime: opencode
      model: example/family-a
      family: family-a
    - name: Engineer two
      runtime: opencode
      model: example/family-b
      family: family-b
  point_cap: 5
workspace:
  # A base directory only: each session creates one directory inside it with mktemp -d
  # (shared/runtimes.md, Scratch files). Optional; the session falls back to a standalone
  # mktemp -d when it is unset, and creates the base when it does not exist yet.
  scratch_dir: /tmp/agent-skills
overlays:
  engineering-workflow: overlays/engineering-workflow.md
