<svg style="font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace" viewBox="0 0 1000 528" role="img" aria-label="The agent-skills lifecycle: a story is captured, refined, implemented, passes a pre-PR gate and a review of record, deploys to dev, is verified by QA, and is closed as Done by the product owner. Review findings are fixed in the same PR, and a QA failure returns the story to In Progress with a new QA agent. Personas own the decisions, and your project supplies its values through a profile and overlays." shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><title>agent-skills workflow</title><rect width="100%" height="100%" fill="#F2F0EA"/><rect x="34" y="20" width="14" height="14" fill="#02ABEA" stroke="#121417" stroke-width="2"/><text x="56" y="32" fill="#121417" font-size="11" font-weight="400" text-anchor="start">workflow skill</text><rect x="184" y="20" width="14" height="14" fill="#1FB714" stroke="#121417" stroke-width="2"/><text x="206" y="32" fill="#121417" font-size="11" font-weight="400" text-anchor="start">independent gate</text><rect x="354" y="20" width="14" height="14" fill="#DD0806" stroke="#121417" stroke-width="2"/><text x="376" y="32" fill="#121417" font-size="11" font-weight="400" text-anchor="start">your project</text><path d="M37 74V66H255V74" fill="none" stroke="#5B6168" stroke-width="2"/><text x="146" y="58" fill="#5B6168" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">PLAN</text><path d="M273 74V66H491V74" fill="none" stroke="#5B6168" stroke-width="2"/><text x="382" y="58" fill="#5B6168" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">BUILD</text><path d="M509 74V66H609V74" fill="none" stroke="#5B6168" stroke-width="2"/><text x="559" y="58" fill="#5B6168" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">REVIEW</text><path d="M627 74V66H963V74" fill="none" stroke="#5B6168" stroke-width="2"/><text x="795" y="58" fill="#5B6168" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">VERIFY</text><rect x="41" y="100" width="100" height="130" fill="#121417"/><rect x="37" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="38" y="97" width="98" height="9" fill="#02ABEA"/><line x1="38" y1="106" x2="136" y2="106" stroke="#121417" stroke-width="2"/><text x="47" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">Capture</text><text x="47" y="145" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">linear-*</text><text x="47" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by PO</text><rect x="159" y="100" width="100" height="130" fill="#121417"/><rect x="155" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="156" y="97" width="98" height="9" fill="#02ABEA"/><line x1="156" y1="106" x2="254" y2="106" stroke="#121417" stroke-width="2"/><text x="165" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">Refine</text><text x="165" y="145" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">story-</text><text x="165" y="158" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">refinement</text><text x="165" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by PO + 2 eng</text><rect x="277" y="100" width="100" height="130" fill="#121417"/><rect x="273" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="274" y="97" width="98" height="9" fill="#02ABEA"/><line x1="274" y1="106" x2="372" y2="106" stroke="#121417" stroke-width="2"/><text x="283" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">Implement</text><text x="283" y="145" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">engineering-</text><text x="283" y="158" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">workflow</text><text x="283" y="171" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">TDD slices</text><text x="283" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by engineer</text><rect x="395" y="100" width="100" height="130" fill="#121417"/><rect x="391" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="392" y="97" width="98" height="9" fill="#1FB714"/><line x1="392" y1="106" x2="490" y2="106" stroke="#121417" stroke-width="2"/><text x="401" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">Pre-PR gate</text><text x="401" y="145" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">adversarial-</text><text x="401" y="158" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">review-</text><text x="401" y="171" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">pipeline</text><text x="401" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by reviewers</text><rect x="513" y="100" width="100" height="130" fill="#121417"/><rect x="509" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="510" y="97" width="98" height="9" fill="#1FB714"/><line x1="510" y1="106" x2="608" y2="106" stroke="#121417" stroke-width="2"/><text x="519" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">Review of</text><text x="519" y="144" fill="#121417" font-size="12" font-weight="600" text-anchor="start">record</text><text x="519" y="161" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">exact head,</text><text x="519" y="174" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">then merge</text><text x="519" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by reviewers</text><rect x="631" y="100" width="100" height="130" fill="#121417"/><rect x="627" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="628" y="97" width="98" height="9" fill="#DD0806"/><line x1="628" y1="106" x2="726" y2="106" stroke="#121417" stroke-width="2"/><text x="637" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">Deploy</text><text x="637" y="144" fill="#121417" font-size="12" font-weight="600" text-anchor="start">to dev</text><text x="637" y="161" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">your env,</text><text x="637" y="174" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">your workflow</text><text x="637" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by engineer</text><rect x="749" y="100" width="100" height="130" fill="#121417"/><rect x="745" y="96" width="100" height="130" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="746" y="97" width="98" height="9" fill="#1FB714"/><line x1="746" y1="106" x2="844" y2="106" stroke="#121417" stroke-width="2"/><text x="755" y="128" fill="#121417" font-size="12" font-weight="600" text-anchor="start">QA verify</text><text x="755" y="145" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">qa-</text><text x="755" y="158" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">verification</text><text x="755" y="171" fill="#5B6168" font-size="10" font-weight="400" text-anchor="start">all AC + DoD</text><text x="755" y="217" fill="#121417" font-size="10" font-weight="600" text-anchor="start">by QA agent</text><rect x="867" y="100" width="100" height="130" fill="#121417"/><rect x="863" y="96" width="100" height="130" fill="#121417" stroke="#121417" stroke-width="2"/><text x="873" y="128" fill="#F2F0EA" font-size="12" font-weight="600" text-anchor="start">Done</text><text x="873" y="145" fill="#F2F0EA" font-size="10" font-weight="400" text-anchor="start">never on</text><text x="873" y="158" fill="#F2F0EA" font-size="10" font-weight="400" text-anchor="start">merge alone</text><text x="873" y="217" fill="#F2F0EA" font-size="10" font-weight="600" text-anchor="start">by PO</text><defs><marker id="ah0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M138 162 L153 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="miter"/><defs><marker id="ah1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M256 162 L271 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah1)" stroke-linejoin="miter"/><defs><marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M374 162 L389 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah2)" stroke-linejoin="miter"/><defs><marker id="ah3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M492 162 L507 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="miter"/><defs><marker id="ah4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M610 162 L625 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah4)" stroke-linejoin="miter"/><defs><marker id="ah5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M728 162 L743 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah5)" stroke-linejoin="miter"/><defs><marker id="ah6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M846 162 L861 162" fill="none" stroke="#121417" stroke-width="2" marker-end="url(#ah6)" stroke-linejoin="miter"/><defs><marker id="ah7" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M559 232 L559 270 L339 270 L339 234" fill="none" stroke="#121417" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah7)" stroke-linejoin="miter"/><text x="449" y="288" fill="#121417" font-size="11" font-weight="400" text-anchor="middle">findings fixed in the same PR</text><defs><marker id="ah8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0H8V8H0z" fill="none"/><path d="M0 0L8 4L0 8z" fill="#121417"/></marker></defs><path d="M795 232 L795 318 L307 318 L307 234" fill="none" stroke="#121417" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah8)" stroke-linejoin="miter"/><text x="551" y="336" fill="#121417" font-size="11" font-weight="400" text-anchor="middle">AC not met: back to In Progress, new QA agent</text><text x="34" y="372" fill="#5B6168" font-size="11" font-weight="600" text-anchor="start" letter-spacing="2">PERSONAS OWN THE DECISIONS</text><rect x="37" y="385" width="113.60000000000001" height="26" fill="#121417"/><rect x="34" y="382" width="113.60000000000001" height="26" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><text x="44" y="400" fill="#121417" font-size="12" font-weight="600" text-anchor="start">product-owner</text><rect x="168.60000000000002" y="385" width="106.4" height="26" fill="#121417"/><rect x="165.60000000000002" y="382" width="106.4" height="26" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><text x="175.60000000000002" y="400" fill="#121417" font-size="12" font-weight="600" text-anchor="start">scrum-master</text><rect x="293" y="385" width="84.8" height="26" fill="#121417"/><rect x="290" y="382" width="84.8" height="26" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><text x="300" y="400" fill="#121417" font-size="12" font-weight="600" text-anchor="start">architect</text><rect x="395.8" y="385" width="106.4" height="26" fill="#121417"/><rect x="392.8" y="382" width="106.4" height="26" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><text x="402.8" y="400" fill="#121417" font-size="12" font-weight="600" text-anchor="start">platform-sre</text><rect x="520.2" y="385" width="128" height="26" fill="#121417"/><rect x="517.2" y="382" width="128" height="26" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><text x="527.2" y="400" fill="#121417" font-size="12" font-weight="600" text-anchor="start">release-manager</text><text x="34" y="434" fill="#5B6168" font-size="11" font-weight="400" text-anchor="start">story-to-done runs Implement to QA and loops until Done. Promotion (develop to main) is optional and owned by the release manager.</text><rect x="38" y="460" width="924" height="56" fill="#121417"/><rect x="34" y="456" width="924" height="56" fill="#FBFAF6" stroke="#121417" stroke-width="2"/><rect x="35" y="457" width="14" height="54" fill="#DD0806"/><line x1="49" y1="457" x2="49" y2="511" stroke="#121417" stroke-width="2"/><text x="64" y="480" fill="#121417" font-size="13" font-weight="600" text-anchor="start">your project fills in the values</text><text x="64" y="499" fill="#5B6168" font-size="11" font-weight="400" text-anchor="start">profile.yaml: states, branches, review models, environments   |   overlays: workflows, hosts, runbooks</text></svg>