# Consumer profile for the agent-skills repository itself.
# The base skills read every project fact from a profile, whole and unmerged, so this file
# replaces the container's home default for any session whose working directory is inside
# this checkout. It describes this repository only: no consumer estate, hosts or environments.
version: 1
project:
  name: Agent Skills
  repos:
    - noahwhite/agent-skills
  test_command: uv run --locked ruff check . && uv run --locked pytest
tracker:
  kind: linear
  team_key: SKL
  team_name: Agent Skills
  assignee: self
  agent_stamp: true
  states:
    triage: Triage
    backlog: Backlog
    ready: Ready To Work
    in_progress: In Progress
    blocked: Blocked
    in_review: In PR Review
    in_deployment_review: In Deployment Review
    done: Done
    canceled: Canceled
    duplicate: Duplicate
  labels:
    user_story: User Story
    spike: Spike
    bug: Bug
    investigation: Investigation
    feature: Feature
    improvement: Improvement
    rtb: RTB
  epic:
    name_prefix: "[EPIC]"
    icon: Cube
    lead: "@me"
  estimate_scale: fibonacci
  cycle_weeks: 2
  velocity_window_cycles: 3
  standup_aging_days: 3
git:
  host: github
  integration_branch: main
  release_branch: main
  promotion: none
  merge_method: squash
  signed_commits: true
  ai_attribution: forbid
  branch_prefixes:
    feature: feature/
review:
  # Owner directive 2026-11-20: the reviewer runs Gemini 3.8 Flash through OpenRouter.
  # The Google provider's own prepayment credits are depleted and the Copilot route refuses this
  # container's PAT, so OpenRouter is the working route; the seat answered a probe on 2026-11-20.
  # Labs across the gate: reviewer Google, arbiter OpenAI, hunter Moonshot, sweeper zhipu, and the
  # adjudicator DeepSeek, so those five roles are pairwise distinct; the simplicity reviewer shares
  # the adjudicator's DeepSeek lab, and it and the fixer sit outside this gate's phases.
  # The opencode runtime enforces no filesystem sandbox here, unlike the codex seat it replaces, so
  # the reviewer's read-only rule is prompt-level: launch it against a throwaway detached worktree,
  # never the branch, and treat any edit it makes as a failed round.
  reviewer:
    name: Gemini 3.8 Flash
    runtime: opencode
    model: openrouter/google/gemini-3.8-flash
  adjudicator:
    name: DeepSeek V4.1 Flash
    runtime: opencode
    model: deepseek/deepseek-flash
  shadow_adjudicators: []
  merge_owner: agent
  pre_pr:
    # Owner directive 2026-11-20: sweep GLM-5.3 Flash, verify-and-hunt Kimi K3.1 Pro, arbitrate
    # GPT-6.2 Astra. The owner raised the OpenRouter key limit the same day, which is what makes the
    # GLM sweep seat routable. Those three seats, plus the reviewer above, each answered a probe in
    # this container on 2026-11-20; that claim covers those four seats only. The fixer seat below did
    # not answer and cannot: every Anthropic route is revoked here (SKL-397).
    # Labs: sweeper zhipu (OpenRouter), hunter Moonshot, arbiter OpenAI, adjudicator DeepSeek.
    sweeper:
      name: GLM-5.3 Flash
      runtime: opencode
      model: openrouter/z-ai/glm-5.3-flash
    # Kimi K3.1 Pro runs on the moonshotai provider, not the kimi provider: the kimi provider that
    # reads KIMI_API_KEY registers only kimi-k3 in the shipped image (the running volume also
    # carries kimi-k3.1-pro, added by hand, and a restart drops it), and adding kimi-k3.1-pro to opencode.json is a
    # live-container edit that entrypoint.sh overwrites at every start, which would kill this
    # mandatory seat on the next restart. The moonshotai entry is part of the image's model
    # registry, so it survives. Move the seat to kimi/kimi-k3.1-pro only once the image ships that
    # model registration.
    hunter:
      name: Kimi K3.1 Pro
      runtime: opencode
      model: moonshotai/kimi-k3.1-pro
    # The hunt mutates and runs code, so give it a phase timeout well above the 900-second default:
    # on a 40-line diff it needed 819 seconds and a 900-second run was killed mid-report.
    arbiter:
      name: GPT-6.2 Astra
      runtime: opencode
      model: openai/gpt-6.2-astra
    simplicity_reviewer:
      name: DeepSeek V4 Pro
      runtime: opencode
      model: deepseek/deepseek-v4-pro
    # Interim (owner decision 2026-11-09): match the engineer, Opus 5.5 at medium effort. The
    # schema has no effort field, so the effort lives in the name and in the launching brief.
    # SKL-225 replaces this pin with a blank entry that inherits the engineer's model.
    fixer:
      name: Opus 5.5 medium
      runtime: claude-code
      model: claude-opus-5-5
# This repository deploys nothing, so there is no environment to promote to or verify in.
environments: []
qa:
  evidence_dir: docs/qa-evidence
refinement:
  # Roster pinned in the repository profile (SKL-81): the container's baked profile is not
  # the only place these values live. Facilitator is the orchestrating session; its entry is
  # nominative, pinned in practice by the scrum-master agent file and any launcher.
  facilitator:
    name: Scrum Master
    runtime: opencode
    model: opencode-go/minimax-m3.1-flash
  product_owner:
    name: Grok 4.7
    runtime: command
    model: opencode-go/grok-4.7
    command: >-
      opencode run --model opencode-go/grok-4.7 "Follow the instructions in the attached file exactly. Do not modify any file."
      --title "{session_title}"
      --file "{prompt_file}" > "{output_file}"
    family: xai
  # The roster is the home profile's three engineer voters, which stopped being two (SKL-181):
  # three reviewers on three distinct model families, each carrying the repository's
  # --title "{session_title}" placeholder so every launch resolves its own usage.
  reviewers:
    - name: DeepSeek V4.1 Flash 1017
      runtime: command
      model: openrouter/deepseek/deepseek-v4.1-flash-1017
      command: >-
        opencode run --model openrouter/deepseek/deepseek-v4.1-flash-1017 "Follow the instructions in the attached file exactly. Do not modify any file."
        --title "{session_title}"
        --file "{prompt_file}" > "{output_file}"
      family: deepseek
    - name: GPT-6.2 Sol
      runtime: command
      model: openai/gpt-6.2-sol
      command: >-
        opencode run --model openai/gpt-6.2-sol "Follow the instructions in the attached file exactly. Do not modify any file."
        --title "{session_title}"
        --file "{prompt_file}" > "{output_file}"
      family: openai
    - name: MiMo V2.6 Flash
      runtime: command
      model: mimo/mimo-v2.6-flash
      command: >-
        opencode run --model mimo/mimo-v2.6-flash "Follow the instructions in the attached file exactly. Do not modify any file."
        --title "{session_title}"
        --file "{prompt_file}" > "{output_file}"
      family: xiaomi
  point_cap: 5

# The seats story-to-done falls back to when an invocation leaves a seat argument out (SKL-83).
# Both labs verified 2026-10-25; a command seat runs from any orchestrator with a shell.
story_to_done:
  engineer:
    name: DeepSeek V4.1 Flash
    runtime: command
    model: deepseek/deepseek-flash
    effort: high
    command: >-
      opencode run --model "{model}#{effort}" "Follow the instructions in the attached file exactly."
      --title "{session_title}"
      --file "{prompt_file}" < /dev/null > "{output_file}"
  qa:
    name: DeepSeek V4 Pro
    runtime: command
    model: deepseek/deepseek-v4-pro
    effort: high
    command: >-
      opencode run --model "{model}#{effort}" "Follow the instructions in the attached file exactly."
      --title "{session_title}"
      --file "{prompt_file}" < /dev/null > "{output_file}"

workspace:
  scratch_dir: /tmp/agent-skills
